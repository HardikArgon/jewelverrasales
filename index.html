<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="https://hardikargon.github.io/jewelverrasales/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jewelverra_sales_admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>jewelverra_sales_admin</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script>
  window.renderExcel = (base64Data, divId) => {
    if (typeof XLSX === 'undefined') return;

    const workbook = XLSX.read(base64Data, { type: 'base64' });
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];

    // Convert sheet to JSON array including blank cells
    const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

    // Filter out fully empty rows
    const filteredData = jsonData.filter(row => row.some(cell => cell.toString().trim() !== ''));

    // Build HTML table
    let htmlStr = '<table style="border-collapse: collapse; font-family: Arial, sans-serif; font-size: 10px; width:100%;">';
    filteredData.forEach(row => {
      htmlStr += '<tr>';
      row.forEach(cell => {
        let cellContent = cell;

        // If cell is URL, make it clickable
        if (typeof cell === 'string' && (cell.startsWith('http://') || cell.startsWith('https://'))) {
          cellContent = `<a href="${cell}" target="_blank">${cell}</a>`;
        }

        htmlStr += `<td style="border:1px solid #999; padding:4px; min-width:30px; min-height:20px;">${cellContent}</td>`;
      });
      htmlStr += '</tr>';
    });
    htmlStr += '</table>';

    const container = document.getElementById(divId);
    container.innerHTML = htmlStr;
  };
</script>
<script src="flutter_bootstrap.js" async></script>
<script>
  (function () {
    // Block developer shortcuts
    function blockKeyEvents(e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key)) ||
        (e.ctrlKey && e.key === 'U')
      ) {
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    }

    // Block right-click
    function blockContextMenu(e) {
      e.preventDefault();
      e.stopImmediatePropagation();
    }

    // Attach listeners
    function attachBlockers() {
      window.addEventListener('keydown', blockKeyEvents, true);
      window.addEventListener('keyup', blockKeyEvents, true);
      window.addEventListener('keypress', blockKeyEvents, true);
      window.addEventListener('contextmenu', blockContextMenu, true);
    }

    // MutationObserver to re-attach if removed
    const observer = new MutationObserver(() => {
      attachBlockers();
    });

    // Observe document for changes that may remove listeners
    observer.observe(document, { childList: true, subtree: true });

    // Periodic re-binding (in case event listeners are nuked)
    setInterval(() => {
      attachBlockers();
    }, 1000);

    // Initial attach
    attachBlockers();
  })();

  window.addEventListener('load', function() {
    _flutter.loader.loadEntrypoint({
      serviceWorker: { serviceWorkerVersion },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(appRunner => appRunner.runApp());
      }
    });
  });
</script>
</body>
</html>
